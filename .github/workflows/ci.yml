name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 uv 并启用依赖缓存。项目刻意不提交 uv.lock（见 .gitignore），
      # 而 setup-uv 默认只按 uv.lock / requirements*.txt 计算缓存键——两者都
      # 不存在时它会警告 "cache will never get invalidated"，即依赖变更后
      # 永远命中旧缓存。故显式指定按 pyproject.toml 计算。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit -v

      # 集成测试里两类用例对 ANTHROPIC_API_KEY 的要求正好互斥，无法用同一份
      # 环境变量同时满足，故分两个步骤跑：
      #
      #   - 需起真 daemon 的用例：守护进程在 server.start() 之前就构造 provider，
      #     而 provider 在 key 为空时 `raise SystemExit` —— 必须给非空值
      #   - test_run_e2e：跳过条件是 key 为空，给非空值（哪怕是占位串）会让它
      #     不跳过、拿假 key 打真实 API 并以 401 失败
      #
      # 两个步骤都显式设置该变量，避免继承到意外来源。
      - name: Integration tests (daemon)
        env:
          ANTHROPIC_API_KEY: ci-placeholder
        run: uv run pytest tests/integration --ignore=tests/integration/test_run_e2e.py -v

      # 需要真实 key 的端到端用例；此处置空使其自行跳过（CI 不发真实请求）
      - name: Integration tests (e2e, self-skips)
        env:
          ANTHROPIC_API_KEY: ""
        run: uv run pytest tests/integration/test_run_e2e.py -v

      - name: Verify protocol doc is in sync
        run: uv run python scripts/gen_protocol_doc.py --check
